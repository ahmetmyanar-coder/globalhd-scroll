<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sayfa bulunamadı · Global HD İnşaat</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root { --paper:#E9E2D5; --ink:#16130E; --soft:#5C5344; --accent:#1D5586;
          --rule:rgba(22,19,14,0.18); }
  * { box-sizing:border-box }
  body { margin:0; min-height:100svh; background:var(--paper); color:var(--ink);
    font-family:"Archivo",system-ui,sans-serif; display:grid; place-content:center;
    padding:clamp(24px,6vw,64px); -webkit-font-smoothing:antialiased }
  .wrap { max-width:46rem }
  .code { font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:0.7rem;
    letter-spacing:0.16em; text-transform:uppercase; color:var(--soft) }
  h1 { font-size:clamp(1.9rem,1.2rem+3vw,3.4rem); line-height:1.02; letter-spacing:-0.02em;
    margin:1.2rem 0 0; font-weight:600; max-width:16ch }
  p { margin-top:1.4rem; max-width:44ch; color:var(--soft); line-height:1.6 }
  .line { height:1px; background:var(--rule); margin:2.4rem 0 1.4rem }
  a { font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:0.82rem;
    color:var(--ink); text-decoration:none; border-bottom:1px solid var(--rule);
    padding-bottom:3px }
  a:hover { color:var(--accent); border-color:var(--accent) }
  a:focus-visible { outline:2px solid var(--accent); outline-offset:3px }
</style>
</head>
<body>
  <div class="wrap">
    <span class="code">Hata 404</span>
    <h1>Bu adreste bir sayfa yok.</h1>
    <p>Aradığınız bağlantı taşınmış ya da hiç var olmamış olabilir. Sunum sayfasının
      tamamı tek adreste duruyor.</p>
    <div class="line"></div>
    <a href="/">Başa dön</a>
  </div>
</body>
</html>
